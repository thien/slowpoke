[project]
name = "slowpoke"
version = "0.1.0"
description = "Checkboard playing program using GANNs and MCTS - inspired by Blondie24"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Slowpoke Developer"}
]
keywords = ["checkers", "draughts", "neural-network", "monte-carlo-tree-search", "gann"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.20.0",
    "matplotlib>=3.5.0",
    "pymongo>=4.0.0",
    "termcolor>=1.1.0",
    "mlx>=0.18.1",
    "pyarrow>=14.0.0",
    "rich>=13.0.0",
    "textual>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "ruff>=0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-xdist>=3.0.0",
    "black>=22.0.0",
    "ruff>=0.1.0",
]
test = [
    "pytest>=8.3.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["slowpoke*"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
addopts = "-m 'not slow'"

[tool.maturin]
module-name = "checkers_core"
features = ["pyo3/extension-module"]
